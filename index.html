<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#6b7380;--line:#e3e6ea;--accent:#2f6df6;--accent-ink:#fff;
  --gym:#2f6df6;--run:#13a86b;--core:#e8820c;--mobility:#8b5cf6;--danger:#d63b3b;--ok:#13a86b;--chip:#eef0f3;--body:#c9ced7;--bodyhi:#ef4a2a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
:root[data-theme=dark]{
  --bg:#0e1013;--card:#181b20;--ink:#eceef1;--mute:#8d95a3;--line:#262a31;--accent:#5b8dff;--accent-ink:#0b1020;
  --gym:#6c9bff;--run:#33c98a;--core:#ffa23a;--mobility:#a78bfa;--danger:#ff6b6b;--ok:#33c98a;--chip:#222730;--body:#3c434f;--bodyhi:#ff5a35;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root[data-theme=auto]{
    --bg:#0e1013;--card:#181b20;--ink:#eceef1;--mute:#8d95a3;--line:#262a31;--accent:#5b8dff;--accent-ink:#0b1020;
    --gym:#6c9bff;--run:#33c98a;--core:#ffa23a;--mobility:#a78bfa;--danger:#ff6b6b;--ok:#33c98a;--chip:#222730;--body:#3c434f;--bodyhi:#ff5a35;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px}
.top h1{font-size:22px;margin:0;letter-spacing:-.02em}
.top .sub{color:var(--mute);font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{background:var(--chip)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.sub{color:var(--mute);font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%}
.btn:active{filter:brightness(.92)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip);color:var(--mute)}
.chip.gym{color:var(--gym)}.chip.run{color:var(--run)}.chip.core{color:var(--core)}.chip.mobility{color:var(--mobility)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.gym{background:var(--gym)}.dot.run{background:var(--run)}.dot.core{background:var(--core)}.dot.mobility{background:var(--mobility)}
.lvl{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;font-size:11px;font-weight:800;color:#fff;vertical-align:middle;padding:0 3px}
.lvl.beginner{background:var(--ok)}.lvl.intermediate{background:var(--core)}.lvl.advanced{background:var(--danger)}
.gcount{float:right;font-weight:700;color:var(--mute)}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ghead h2{margin:0;flex:1}
.bodymap{display:block;flex:0 0 auto}
.vid{font-size:12px;color:var(--danger);padding:7px 11px;letter-spacing:-1px}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gtile{background:var(--card);border:0;border-radius:16px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:var(--shadow);color:inherit}
.gtile b{font-size:12.5px;text-align:center;line-height:1.15}
.gtile span{font-size:11px;color:var(--mute)}
.gtile:active{opacity:.75}
.bodypick{display:block;width:100%;height:auto}
.bodypick .bm-b{pointer-events:none}
.mu{fill:var(--body);cursor:pointer}
.mu use{stroke:transparent;stroke-width:16;pointer-events:all}
.mu.off{opacity:.38;pointer-events:none}
.mu.on,.mu:active{fill:var(--bodyhi)}
.bodywrap{display:flex;gap:4px;align-items:flex-start}
.bodywrap>div{flex:1;min-width:0;text-align:center}
#mulabel{text-align:center;min-height:22px;margin-top:6px;font-size:14px}
.plan-day{padding:10px 0}.plan-day+.plan-day{border-top:1px solid var(--line)}
.rep{display:grid;grid-template-columns:22px 1fr 8px 1fr 1fr 34px;align-items:center;gap:5px;padding:3px 0}
.rep input{text-align:center;font-weight:700;min-height:40px;padding:6px}
.rep .rn{color:var(--mute);font-weight:700;text-align:center;font-size:13px}
.zv{margin-top:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.zbar{height:8px;border-radius:9px;background:var(--chip);position:relative;margin-top:6px;overflow:hidden}
.zbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 35%,transparent)}
.zbar .mk{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--ink)}
.cd{display:flex;align-items:baseline;gap:8px}
.cd b{font-size:30px;letter-spacing:-.02em}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.kseg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer;font-size:13px;min-height:40px}
.kseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bm-b{fill:var(--body)}
.bm-h{fill:var(--bodyhi);animation:bmpulse 2.6s ease-in-out infinite}
@keyframes bmpulse{0%,100%{opacity:.82}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bm-h{animation:none;opacity:1}}
.ex-main{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.seg.sm button{padding:6px;font-size:13px;min-height:32px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);cursor:pointer;font-weight:600}
.tab.on{color:var(--accent)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;padding:8px 0;border-radius:12px;background:var(--chip);font-size:12px;color:var(--mute)}
.wd b{display:block;font-size:16px;color:var(--ink);margin:2px 0 4px}
.wd.today{outline:2px solid var(--accent)}
.wd .mk{height:10px;display:flex;justify-content:center;align-items:center;gap:3px}
.wd .ok{color:var(--ok);font-weight:800;font-size:13px;line-height:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mute)}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-size:14px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer;min-height:38px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mute);font-weight:700;padding:4px 0}
.cal button{border:0;background:var(--chip);border-radius:10px;min-height:44px;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600}
.cal button.blank{background:transparent;cursor:default}
.cal button.today{outline:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;height:7px}
.cal .dots .dot{width:6px;height:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pr{display:inline-block;background:var(--core);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.04em}
.sess{padding:12px 0}
.sess+.sess{border-top:1px solid var(--line)}
.sets{font-size:13px;color:var(--mute);margin-top:4px}
.sets b{color:var(--ink)}
/* workout overlay */
#wk{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#wk[hidden]{display:none}
.wk-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.wk-title{flex:1;min-width:0}
.title-in{border:0!important;background:transparent!important;padding:0!important;min-height:0!important;font-size:18px;font-weight:800;width:100%}
.wk-title .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-in{width:auto!important;min-height:0!important;padding:2px 6px!important;font-size:12px;border-radius:8px!important}
.wk-scroll{flex:1;overflow-y:auto;padding:6px 14px;max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.ex{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.ex h3{margin:0;font-size:17px}
.last{font-size:12px;color:var(--mute);margin:2px 0 8px}
.set{display:grid;grid-template-columns:24px 1fr auto 1fr auto 46px;align-items:center;gap:6px;padding:4px 0}
.set.noweight{grid-template-columns:24px 1fr auto 46px}
.set .sn{color:var(--mute);font-weight:700;text-align:center}
.set .x{color:var(--mute);font-size:12px}
.set input{text-align:center;font-weight:700;font-size:17px}
.set.done input{background:color-mix(in srgb,var(--ok) 14%,var(--bg));border-color:transparent}
.chk{width:46px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);font-size:20px;font-weight:800;cursor:pointer}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
#restbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
#restbar:empty{display:none}
#restbar .bar{height:5px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:8px}
#restbar .bar i{display:block;height:100%;background:var(--accent)}
.rest-t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.rest-t.over{color:var(--ok)}
.pace{font-size:20px;font-weight:800;color:var(--run);margin-top:10px}
/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hint{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mute);margin:10px 0}
.wear{height:7px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:8px}
.wear i{display:block;height:100%;border-radius:9px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.shoe{display:block;padding:12px 2px}
.tpl-row{display:grid;grid-template-columns:1fr 62px 62px 36px;gap:6px;align-items:center;padding:6px 0}
.tpl-row input{min-height:38px;padding:6px 8px;text-align:center}
textarea{resize:vertical}
.plan-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:6px 0}
.plan-row b{color:var(--mute)}
.hgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:12px}
.hgrid i{aspect-ratio:1;border-radius:3px;background:var(--chip)}
.hgrid i.ok{background:var(--ok)}
.hgrid i.now{outline:2px solid var(--accent);outline-offset:1px}
.htask{display:flex;align-items:flex-start;gap:12px;padding:12px 0}
.htask+.htask{border-top:1px solid var(--line)}
.hchk{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:transparent;background:var(--bg);font-size:15px}
.hchk.on{background:var(--ok);border-color:var(--ok);color:#fff}
button.hchk{cursor:pointer;padding:0}
.hbar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.sleepb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sleepb button{min-height:42px;border:0;border-radius:10px;background:var(--chip);font-weight:700;cursor:pointer;color:var(--ink);font-size:16px}
.sleepb button.on{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--chip);color:var(--mute)}
.badge.on{background:var(--core);color:#fff}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hcal button{border:0;border-radius:8px;min-height:38px;font-weight:700;font-size:13px;cursor:pointer;background:var(--chip);color:var(--ink)}
.hcal button.ok{background:var(--ok);color:#fff}
.hcal button.bad{background:var(--danger);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="wk" hidden></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const todayStr=()=>ymd(new Date());
const dow=d=>(d.getDay()+6)%7; // Monday = 0
const fmtDate=(s,o)=>parseYmd(s).toLocaleDateString(undefined,o||{weekday:'short',day:'numeric',month:'short'});
const fmtTime=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)};
const fmtPace=p=>{if(!isFinite(p)||p<=0)return '–';let m=Math.floor(p/60),s=Math.round(p%60);if(s===60){m++;s=0}return m+':'+pad(s)+'/km'};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const r1=n=>Math.round(n*10)/10;
const e1rm=(w,r)=>(w>0&&r>0)?(r===1?w:w*(1+r/30)):0;
const clone=o=>JSON.parse(JSON.stringify(o));
const safeUrl=u=>{u=String(u==null?'':u).trim();return /^https?:\/\//i.test(u)?u:''};
const normUrl=u=>{u=String(u==null?'':u).trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return safeUrl(u)};
const TYPES={gym:'Gym',run:'Run',core:'Core',mobility:'Mobility'};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const LEVELS={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced'};
const RUNKINDS={
 recovery:{label:'Recovery',z:[0.60,0.70],hint:'Very easy shake-out'},
 easy:{label:'Easy',z:[0.65,0.75],hint:'Conversational base pace'},
 long:{label:'Long',z:[0.68,0.78],hint:'Weekly long run'},
 threshold:{label:'Threshold',z:[0.80,0.88],hint:'Comfortably hard tempo'},
 intervals:{label:'Intervals',z:[0.88,0.95],hint:'4x4, 30/30, reps'},
 race:{label:'Race',z:[0.85,1.00],hint:'Race or time trial'}
};
const REP_PRESETS={
 'norwegian':{label:'Norwegian 4\u00d74',reps:4,min:4,sec:0},
 '30-30':{label:'30/30 \u00d7 10',reps:10,min:0,sec:30},
 'r5':{label:'5 blank reps',reps:5,min:0,sec:0},
 'r8':{label:'8 blank reps',reps:8,min:0,sec:0}
};
function zoneBand(kind){
  const mx=num(S.cfg.maxHR);if(!mx)return null;
  const k=RUNKINDS[kind]||RUNKINDS.easy;
  const o=(S.cfg.zones||{})[kind];
  const z=(o&&o.length===2)?o:k.z;
  return {lo:Math.round(mx*z[0]),hi:Math.round(mx*z[1])};
}
function zoneVerdict(kind,hr){
  const b=zoneBand(kind);hr=num(hr);
  if(!b||!hr)return null;
  const lab=(RUNKINDS[kind]||RUNKINDS.easy).label.toLowerCase();
  if(hr<b.lo)return {t:'below',txt:'Below the '+lab+' band ('+b.lo+'\u2013'+b.hi+' bpm)',c:'var(--mute)',b:b};
  if(hr>b.hi)return {t:'above',txt:'Above the '+lab+' band ('+b.lo+'\u2013'+b.hi+' bpm)',c:'var(--danger)',b:b};
  return {t:'in',txt:'In the '+lab+' band ('+b.lo+'\u2013'+b.hi+' bpm)',c:'var(--ok)',b:b};
}
function zoneBarHTML(kind,hr){
  const v=zoneVerdict(kind,hr),mx=num(S.cfg.maxHR);
  if(!v||!mx)return '';
  const lo=num(S.cfg.restHR)||40,span=mx-lo;
  const pc=x=>Math.max(0,Math.min(100,(x-lo)/span*100));
  return '<div class="zv" style="color:'+v.c+'">'+(v.t==='in'?'\u2713':v.t==='above'?'\u25b2':'\u25bc')+' '+esc(v.txt)+'</div>'
    +'<div class="zbar"><i class="band" style="left:'+pc(v.b.lo).toFixed(1)+'%;width:'+(pc(v.b.hi)-pc(v.b.lo)).toFixed(1)+'%"></i><i class="mk" style="left:'+pc(num(hr)).toFixed(1)+'%"></i></div>';
}

const SLUG_GROUPS={
 chest:['Chest'],
 'upper-back':['Back','Thoracic spine'],

const BACK_SLUGS=['trapezius','deltoids','upper-back','triceps','lower-back','forearm','gluteal','adductors','hamstring','calves','ankles'];
function muscleGroup(slug){
  const cands=SLUG_GROUPS[slug];if(!cands)return null;
  const f=S.filter||'all';
  for(let i=0;i<cands.length;i++){
    const g=cands[i];
    const n=S.cfg.exercises.filter(e=>!e.guide&&e.type!=='run'&&(e.group||'')===g&&(f==='all'||e.type===f)).length;
    if(n)return {name:g,n:n};
  }
  return null;
}
function bodyOne(view){
  const pre=(view==='front')?'f-':'b-',slugs=(view==='front')?FRONT_SLUGS:BACK_SLUGS;
  let out='<svg class="bodypick" viewBox="'+BODY_VB[view]+'" role="img" aria-label="'+view+' body"><use href="#'+pre+'all" class="bm-b"/>';
  slugs.forEach(sl=>{
    const g=muscleGroup(sl);
    out+='<g class="mu'+(g?'':' off')+'"'+(g?' data-act="musclepick" data-s="'+sl+'"':'')+'>'
      +(g?'<title>'+esc(g.name)+' \u00b7 '+g.n+'</title>':'')
      +'<use href="#'+pre+sl+'"/></g>';
  });
  return out+'</svg>';
}

  return '<div class="card"><div class="bodywrap">'

const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};

function mirror(){lsSet('wl_mirror',{cfg:S.cfg,sessions:S.sessions})}
function enqueue(fn){
  P.pending++;

}

}

}

const val=(m,s)=>m==='wr'?e1rm(num(s.w),num(s.r)):m==='reps'?num(s.r):num(s.t);

function prevSets(exId){
  const ss=sortedSessions();
  for(let i=ss.length-1;i>=0;i--){
    const its=ss[i].items||[];
    for(const it of its){ if(it.exId===exId&&it.sets.length) return it.sets }
  }
  return [];
}
function bestFor(exId,measure,skip){
  let best=0,has=false;
  S.sessions.forEach(s=>(s.items||[]).forEach(it=>{
    if(it.exId===exId) it.sets.forEach(st=>{has=true;best=Math.max(best,val(measure,st))});
  }));
  if(W) W.items.forEach(it=>{ if(it.exId===exId) it.sets.forEach(st=>{ if(st!==skip&&st.done){has=true;best=Math.max(best,val(measure,st))} }) });
  return {best,has};
}
function lastRun(){
  const ss=sortedSessions().filter(s=>s.type==='run'&&s.run);

}
const runPace=r=>r.secs/r.km;
const runKind=s=>(s&&s.run&&s.run.kind)||'easy';
function sessSummary(s){

  let n=0,vol=0;(s.items||[]).forEach(it=>it.sets.forEach(st=>{n++;if(it.measure==='wr')vol+=num(st.w)*num(st.r)}));
  return n+' sets'+(vol?' · '+Math.round(vol).toLocaleString()+' kg volume':'');
}
function weekTarget(){
  const sch=S.cfg.schedule||{};
  if(Object.keys(sch).length){
    const mon=mondayOf(new Date());let n=0;
    for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(x.getDate()+i);n+=schedFor(ymd(x)).filter(e=>e.type!=='rest').length}
    if(n)return n;
  }
  let n=0;for(let i=0;i<7;i++)n+=planFor(i).length;
  return n||3;
}
function weekCount(mon){
  const a=ymd(mon),e=new Date(mon);e.setDate(e.getDate()+6);const b=ymd(e);
  return S.sessions.filter(s=>s.date>=a&&s.date<=b).length;
}
function weekStreak(){
  const T=weekTarget(),now=mondayOf(new Date());
  let cur=0,m=new Date(now);
  if(weekCount(m)>=T)cur++;
  m.setDate(m.getDate()-7);
  while(weekCount(m)>=T){cur++;m.setDate(m.getDate()-7)}
  let best=0,run=0;
  if(S.sessions.length){
    const first=mondayOf(parseYmd(sortedSessions()[0].date));
    for(let d=new Date(first);d<=now;d.setDate(d.getDate()+7)){
      if(weekCount(d)>=T){run++;best=Math.max(best,run)}else if(+d!==+now)run=0;
    }
  }
  return {cur,best:Math.max(best,cur),T,thisWeek:weekCount(now)};
}

  const kw=kmWarning(mon);

  html+='</div>';
  const sch=schedFor(ts),bi=blockInfo();
  if(sch.length){
    html+='<div class="card"><h2>'+((bi&&bi.active)?esc(bi.name)+' \u00b7 week '+bi.wk+' of '+bi.weeks:'Planned for today')+'</h2>'
      +'<div class="list">'+sch.map((e,i)=>schedRow(ts,e,i,false)).join('')+'</div></div>';
    html+='<div class="card"><h2>Start something else</h2>';
    html+='<div class="row" style="flex-wrap:wrap"><button class="btn sm grow" data-act="start" data-type="run">+ Run</button><button class="btn sm grow" data-act="start" data-type="gym">+ Gym</button><button class="btn sm grow" data-act="start" data-type="core">+ Core</button><button class="btn sm grow" data-act="start" data-type="mobility">+ Mobility</button></div></div>';
    if(doneToday.length) html+='<div class="card"><h2>Done today</h2>'+doneToday.map(sessCard).join('')+'</div>';

  html+='<div class="card"><h2>Planned for today</h2>';

    html+='<div class="list">'+todays.map(t=>{
      const done=doneToday.some(s=>s.templateId===t.id);

        +(done?'<span class="chip" style="color:var(--ok)">Done \u2713</span>':'<button class="btn sm primary" data-act="start" data-tpl="'+t.id+'">'+(t.type==='run'?'Log':'Start')+'</button>')+'</div>';
    }).join('')+'</div>';
  } else html+='<div class="empty" style="padding:8px">Rest day. Build your week in the Plan tab.</div>';
  html+='</div>';
  html+='<div class="card"><h2>Start something else</h2>';
  const others=S.cfg.templates.filter(t=>!todays.some(x=>x.id===t.id));
  if(others.length) html+='<div class="list">'+others.map(t=>'<button class="item" data-act="start" data-tpl="'+t.id+'"><span class="dot '+t.type+'"></span><span class="grow"><b>'+esc(t.name)+'</b></span><span class="sub">'+(t.type==='run'?(RUNKINDS[t.runKind||'easy']||RUNKINDS.easy).label:TYPES[t.type])+'</span></button>').join('')+'</div>';

}
function weekKm(mon){
  const a=ymd(mon),e=new Date(mon);e.setDate(e.getDate()+6);const b=ymd(e);
  return S.sessions.filter(s=>s.type==='run'&&s.run&&s.date>=a&&s.date<=b).reduce((x,s)=>x+num(s.run.km),0);
}
function kmWarning(mon){
  const prev=new Date(mon);prev.setDate(prev.getDate()-7);
  const now=weekKm(mon),last=weekKm(prev);
  if(last<5||now<=last)return '';
  const up=(now-last)/last*100;
  return up>10?'Running volume is up '+Math.round(up)+'% on last week ('+r1(last)+' \u2192 '+r1(now)+' km). Build gradually to stay injury-free.':'';
}

function groupSort(by){
  return GROUP_ORDER.filter(g=>by[g]).concat(Object.keys(by).filter(g=>GROUP_ORDER.indexOf(g)<0).sort());
}
const FOCUS_WORDS=[
 ['chest',['Chest']],['pec',['Chest']],
 ['back',['Back']],['lat',['Back']],
 ['shoulder',['Shoulders']],['delt',['Shoulders']],
 ['bicep',['Biceps']],['tricep',['Triceps']],
 ['arm',['Biceps','Triceps']],
 ['quad',['Quads']],['hamstring',['Hamstrings']],['glute',['Glutes']],
 ['calf',['Calves']],['calves',['Calves']],
 ['leg',['Quads','Hamstrings','Glutes','Calves']],
 ['lower',['Quads','Hamstrings','Glutes','Calves']],
 ['core',['Core']],['abs',['Core']],
 ['push',['Chest','Shoulders','Triceps']],
 ['pull',['Back','Biceps']],
 ['upper',['Chest','Back','Shoulders','Biceps','Triceps']],
 ['full body',['Chest','Back','Shoulders','Quads','Hamstrings','Glutes','Core']],
 ['hip',['Hips']],['ankle',['Ankles']],['thoracic',['Thoracic spine']],['mobility',['Hips','Ankles','Thoracic spine','Shoulder mobility','Full body']]
];
function inferFocus(name){
  const n=String(name||'').toLowerCase(),out=[];
  FOCUS_WORDS.forEach(w=>{ if(n.indexOf(w[0])>=0) w[1].forEach(g=>{if(out.indexOf(g)<0)out.push(g)}) });
  return out;
}
function focusGroups(type){
  const set={},mob=(type==='mobility');
  S.cfg.exercises.forEach(e=>{
    if(e.guide||e.type==='run')return;
    if(mob!==(e.type==='mobility'))return;
    set[e.group||'Other']=1;
  });
  return groupSort(set);
}
function focusList(type,focus,showAll){
  let list=S.cfg.exercises.filter(e=>!e.guide&&e.type!=='run');
  if(focus&&focus.length&&!showAll) return list.filter(e=>focus.indexOf(e.group||'Other')>=0);
  if(type) return list.filter(e=>e.type===type);
  return list;
}
function exOptions(type,sel,focus,showAll){
  const by={};
  focusList(type,focus,showAll).forEach(e=>{const g=e.group||'Other';(by[g]=by[g]||[]).push(e)});
  return groupSort(by).map(g=>'<optgroup label="'+esc(g)+'">'+by[g].sort((a,b)=>(LV_ORD[a.level||'beginner']-LV_ORD[b.level||'beginner'])||a.name.localeCompare(b.name)).map(e=>'<option value="'+e.id+'"'+(sel===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</optgroup>').join('');
}
const sortEx=a=>a.sort((x,y)=>(LV_ORD[x.level||'beginner']-LV_ORD[y.level||'beginner'])||x.name.localeCompare(y.name));
function libFiltered(){
  const f=S.filter||'all',lv=S.libLevel||'all',ro=!!S.libRun,q=String(S.libQ||'').trim().toLowerCase();
  return S.cfg.exercises.filter(e=>
    (f==='all'||e.type===f)
    &&(lv==='all'||(e.level||'beginner')===lv)
    &&(!ro||e.run)
    &&(!q||e.name.toLowerCase().indexOf(q)>=0||String(e.group||'').toLowerCase().indexOf(q)>=0));
}
function levelBar(){

function libResultsHTML(){

const RUNGUIDES=[
['Easy run','Easy runs','beginner','easy','The backbone of every training plan and the run you should do most often. Go at a pace where you could hold a conversation \u2014 if you cannot speak a full sentence, slow down, whatever the pace says. Most of your weekly distance belongs here. It builds capillaries, mitochondria and tendon resilience at almost no recovery cost, which is exactly why it is what raises your speed at a given heart rate over months.'],
['Recovery run','Easy runs','beginner','recovery','Shorter and slower than an easy run, done the day after something hard. The aim is blood flow and loosening off, not fitness. If it feels absurdly slow, it is correct. Keep it to 20\u201335 minutes.'],
['Long run','Long runs','beginner','long','One run a week noticeably longer than the rest, run at easy effort throughout. It builds fat-burning efficiency, mental endurance and the durability of your legs and feet. Grow it by 1\u20132 km a week at most \u2014 this is the run that most often causes injury when rushed.'],
['Progression run','Easy runs','intermediate','easy','Start easy and finish faster. For example over 6 km: 4 km easy, then 2 km at a moderate effort. It teaches you to run well on tired legs and adds useful stimulus without the recovery cost of a full hard session. A good replacement for one easy run a week.'],
['Steady state run','Easy runs','intermediate','long','Slightly harder than easy but still comfortable \u2014 the gap between easy pace and threshold. Useful once a week when you want more stimulus than an easy run without needing two days to recover. Keep it to 30\u201350 minutes.'],
['Fast-finish long run','Long runs','advanced','long','A long run where the final 2\u20133 km are run at goal race effort. It simulates late-race fatigue and teaches pacing discipline. Use it sparingly and only in the last weeks before a goal race \u2014 it is demanding and needs real recovery afterwards.'],
['Strides','Easy runs','beginner','intervals','Six to eight relaxed accelerations of about 20 seconds, walking back to full recovery between each. Not a workout: a technique and economy drill added at the end of an easy run. These improve running economy quickly at almost no fatigue cost, which makes them the cheapest speed available to you.'],
['Tempo / threshold run','Intervals','intermediate','threshold','A continuous 20\u201340 minute effort at \u201ccomfortably hard\u201d \u2014 you can say a few words, not a whole sentence. It raises the pace you can hold before lactate starts accumulating, which is the single biggest determinant of half and full marathon pace. One per week is plenty.'],
['Cruise intervals','Intervals','intermediate','threshold','Threshold work broken into chunks, for example 3 \u00d7 8 minutes with 2 minutes of jogging between. The physiological benefit matches a continuous tempo run, but the breaks make it far easier to hold the right effort, so it is the better starting point.'],
['Over-unders','Intervals','advanced','threshold','Alternate 2 minutes just above threshold with 2 minutes just below, continuously, for 15\u201325 minutes. It trains your body to clear lactate while still running hard. Demanding \u2014 only once you are comfortable with ordinary tempo work.'],
['Norwegian 4\u00d74','VO2 max','advanced','intervals','Four efforts of 4 minutes at 90\u201395% of maximum heart rate, with 3 minutes of easy jogging between. The most studied VO2 max session there is, and the most reliable way to raise your ceiling. Only the last minute or so of each rep should reach the top of the range. At most one per week.'],
['30/30 intervals','VO2 max','intermediate','intervals','Thirty seconds hard followed by thirty seconds of easy jogging, repeated 10\u201320 times. It accumulates a lot of time at high oxygen uptake while feeling far more manageable than long reps, which makes it the best entry point into VO2 max work.'],
['5 \u00d7 3 min','VO2 max','advanced','intervals','Five efforts of 3 minutes close to maximum heart rate, with 2\u20133 minutes of jogging between. Shorter and slightly faster than the 4\u00d74. Use it as a variation so the same session does not become stale.'],
['1 km repeats','Intervals','intermediate','intervals','Four to six repetitions of 1 km at roughly 5 km race effort, with 2\u20133 minutes of jogging between. Because it is measured by pace rather than heart rate, progress is easy to see from one session to the next.'],
['Yasso 800s','Intervals','advanced','intervals','Repeats of 800 m with an equal-length jog recovery, classically ten of them. Widely used as a marathon time predictor \u2014 treat the prediction loosely, but it is an effective session in its own right.'],
['Hill repeats','Intervals','intermediate','intervals','Six to ten efforts of 45\u201390 seconds hard uphill, jogging back down to recover. Builds power and running economy with less impact than flat sprinting, and is notably gentler on the hamstrings. Excellent for runners prone to injury.'],

function mergeCatalog(){
  const ex=S.cfg.exercises=S.cfg.exercises||[],byName={};
  ex.forEach(e=>{byName[String(e.name||'').trim().toLowerCase()]=e});
  let added=0;
  CATALOG.forEach(c=>{
    const cur=byName[c[0].trim().toLowerCase()];
    if(cur){
      if(!cur.level)cur.level=c[4];
      if(cur.run==null)cur.run=!!c[5];
      if(!cur.group||cur.group==='Other')cur.group=c[2];
      return;
    }
    const o={id:uid(),name:c[0],type:c[1],group:c[2],measure:c[3],level:c[4],run:!!c[5],notes:'',video:''};
    ex.push(o);byName[c[0].trim().toLowerCase()]=o;added++;
  });
  RUNGUIDES.forEach(g=>{
    const cur=byName[g[0].trim().toLowerCase()];
    if(cur){cur.guide=true;cur.kind=g[3];cur.desc=g[4];cur.group=g[1];cur.level=g[2];cur.type='run';return}
    const o={id:uid(),name:g[0],type:'run',group:g[1],level:g[2],kind:g[3],desc:g[4],guide:true,run:true,measure:'wr',notes:'',video:''};
    ex.push(o);byName[g[0].trim().toLowerCase()]=o;added++;
  });
  S.cfg.catalogV=CATALOG_V;
  return added;
}

function lineChart(pts,o){
  o=o||{};
  if(!pts.length) return '<div class="empty">No data yet</div>';
  const Wd=340,H=190,pl=44,pr=12,pt=14,pb=26,col=o.color||'var(--accent)';
  let xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  if(y0===y1){y0-=1;y1+=1}
  const py=(y1-y0)*.15;y0-=py;y1+=py;if(o.zero&&y0<0)y0=0;
  const X=x=>pl+(x-x0)/(x1-x0)*(Wd-pl-pr);
  const Y=y=>o.invert?pt+(y-y0)/(y1-y0)*(H-pt-pb):pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const f=o.fmt||(v=>String(r1(v)));
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3,yy=Y(v);g+='<line class="grid" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(pl-6)+'" y="'+(yy+3)+'" text-anchor="end">'+esc(f(v))+'</text>'}
  const dl=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  g+='<text x="'+pl+'" y="'+(H-8)+'" text-anchor="start">'+dl(x0)+'</text><text x="'+(Wd-pr)+'" y="'+(H-8)+'" text-anchor="end">'+dl(x1)+'</text>';
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const circ=pts.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" fill="'+col+'"><title>'+esc(dl(p.x)+': '+f(p.y))+'</title></circle>').join('');
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img">'+g+(pts.length>1?'<path class="ln" stroke="'+col+'" d="'+path+'"/>':'')+circ+'</svg>';
}
function barChart(cols,labels,o){
  o=o||{};
  const Wd=340,H=170,pl=30,pr=8,pt=10,pb=24,n=cols.length;
  const totals=cols.map(c=>c.reduce((a,b)=>a+b.v,0)),mx=Math.max(1,...totals);
  const bw=(Wd-pl-pr)/n,f=o.fmt||(v=>String(r1(v)));
  let g='';
  for(let i=0;i<3;i++){const v=mx*i/2,yy=pt+(1-i/2)*(H-pt-pb);g+='<line class="grid" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(pl-5)+'" y="'+(yy+3)+'" text-anchor="end">'+esc(f(v))+'</text>'}
  cols.forEach((c,i)=>{
    let acc=0;
    c.forEach(seg=>{
      if(seg.v<=0)return;
      const h=seg.v/mx*(H-pt-pb),y=pt+(H-pt-pb)-acc-h;acc+=h;
      g+='<rect x="'+(pl+i*bw+bw*.18).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+seg.c+'"><title>'+esc(f(seg.v))+'</title></rect>';
    });
    if(i%Math.ceil(n/6)===0||i===n-1)g+='<text x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img">'+g+'</svg>';
}

function runStats(list){

  const km=r.reduce((t,x)=>t+num(x.run.km),0),secs=r.reduce((t,x)=>t+num(x.run.secs),0);

  return {n:r.length,km:km,secs:secs,pace:km>0?secs/km:0,epace:ekm>0?esec/ekm:0,ekm:ekm,
    eff:ef.length?ef.reduce((t,v)=>t+v,0)/ef.length:0,
    hr:hrs.length?hrs.reduce((t,v)=>t+v,0)/hrs.length:0,runs:r};

function gymStats(list){

  let vol=0,sets=0;const prs=[],byEx={};
  g.forEach(x=>(x.items||[]).forEach(it=>it.sets.forEach(st=>{
    sets++;

    const e=byEx[it.exId]=byEx[it.exId]||{name:it.name,measure:it.measure,vol:0,best:0,n:0};

function delta(c,p,fmt,lowerBetter){

  const good=lowerBetter?dd<0:dd>0;
  return '<span style="color:'+(good?'var(--ok)':'var(--danger)')+';font-weight:700">'+(dd>0?'+':'\u2212')+fmt(Math.abs(dd))+'</span>';
}

  if(!list.length) return '<div class="card"><div class="empty">Log a gym or core workout and your progression charts will show up here.</div></div>';
  if(!S.prog.ex||!map[S.prog.ex])S.prog.ex=list[0].id;
  const ex=map[S.prog.ex];
  const metrics=ex.measure==='wr'?[['e1rm','Est. 1RM'],['top','Top weight'],['vol','Volume']]:ex.measure==='reps'?[['best','Best set'],['total','Total reps']]:[['best','Best hold'],['total','Total time']];
  if(!metrics.some(m=>m[0]===S.prog.metric))S.prog.metric=metrics[0][0];
  const met=S.prog.metric,unit=ex.measure==='wr'?' kg':ex.measure==='time'?' s':'';
  const pts=ex.rows.map(r=>{
    let y=0;
    if(ex.measure==='wr'){
      if(met==='e1rm')y=Math.max(...r.sets.map(s=>e1rm(num(s.w),num(s.r))));
      else if(met==='top')y=Math.max(...r.sets.map(s=>num(s.w)));
      else y=r.sets.reduce((a,s)=>a+num(s.w)*num(s.r),0);
    } else {
      const k=ex.measure==='reps'?'r':'t';
      y=met==='best'?Math.max(...r.sets.map(s=>num(s[k]))):r.sets.reduce((a,s)=>a+num(s[k]),0);
    }
    return {x:parseYmd(r.date).getTime(),y};
  });
  // merge same-day points (keep max for non-volume/total)
  const merged=[];pts.forEach(p=>{const l=merged[merged.length-1];if(l&&l.x===p.x)l.y=(met==='vol'||met==='total')?l.y+p.y:Math.max(l.y,p.y);else merged.push(p)});
  // personal records
  let bestE=0,bestEs=null,bestW=0,bestWs=null,bestR=0,bestT=0;

    if(num(s.w)>bestW){bestW=num(s.w);bestWs={s,d:r.date}}

  else if(ex.measure==='reps') prs='<div class="stat"><b>'+bestR+'</b><span>best set (reps)</span></div><div class="stat"><b>'+ex.rows.length+'</b><span>sessions</span></div>';
  else prs='<div class="stat"><b>'+bestT+'s</b><span>best hold</span></div><div class="stat"><b>'+ex.rows.length+'</b><span>sessions</span></div>';
  const recent=ex.rows.slice(-6).reverse().map(r=>'<div class="sets"><b>'+esc(fmtDate(r.date,{day:'numeric',month:'short'}))+'</b> '+r.sets.map(s=>esc(setStr(ex.measure,s))).join(' · ')+'</div>').join('');
  return '<div class="card"><select data-f="prog-ex">'+list.map(e=>'<option value="'+e.id+'"'+(e.id===ex.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select>'
    +'<div class="seg" style="margin:10px 0">'+metrics.map(m=>'<button class="'+(met===m[0]?'on':'')+'" data-act="prog-metric" data-v="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>'
    +lineChart(merged,{color:'var(--gym)',fmt:v=>String(r1(v)),zero:met==='vol'||met==='total'})
    +'<div class="sub" style="text-align:center">'+metrics.find(m=>m[0]===met)[1]+(unit?' ('+unit.trim()+')':'')+' per session</div></div>'
    +'<div class="stats">'+prs+'</div><div class="card"><h2>Recent sessions</h2>'+recent+'</div>';
}
const effOf=r=>(r.km>0&&r.secs>0&&r.hr)?(r.km*1000/(r.secs/60))/r.hr:0;
function progRun(){
  const allRuns=sortedSessions().filter(s=>s.type==='run'&&s.run);
  if(!allRuns.length) return '<div class="card"><div class="empty">Log a run and your pace, heart-rate and efficiency trends will show up here.</div></div>';
  const kf=S.prog.kind||'all';
  const KF=[['all','All'],['easy','Easy + recovery'],['long','Long'],['threshold','Threshold'],['intervals','Intervals']];
  const match=s=>{const k=runKind(s);return kf==='all'||(kf==='easy'?(k==='easy'||k==='recovery'):k===kf)};
  const runs=allRuns.filter(match);
  let html='<div class="seg sm" style="margin-bottom:8px;flex-wrap:wrap">'+KF.map(x=>'<button class="'+(kf===x[0]?'on':'')+'" data-act="prog-kind" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  const tot=allRuns.reduce((a,r)=>a+num(r.run.km),0);
  const wk=weeklyCols(10);
  const cols=wk.cols.map(w=>[{v:allRuns.filter(r=>r.date>=w.a&&r.date<=w.b).reduce((a,r)=>a+num(r.run.km),0),c:'var(--run)'}]);
  html+='<div class="stats"><div class="stat"><b>'+r1(tot)+'</b><span>total km</span></div><div class="stat"><b>'+allRuns.length+'</b><span>runs</span></div><div class="stat"><b>'+r1(Math.max.apply(null,allRuns.map(r=>num(r.run.km))))+'</b><span>longest (km)</span></div></div>';
  html+='<div class="card"><h2>Weekly distance (km)</h2>'+barChart(cols,wk.labels)+'<div class="sub" style="text-align:center">All runs. Keep weekly jumps under about 10%.</div></div>';
  if(!runs.length) return html+'<div class="card"><div class="empty">No runs of that type yet.</div></div>';
  const X=r=>parseYmd(r.date).getTime();
  const pace=runs.map(r=>({x:X(r),y:runPace(r.run)}));
  const hr=runs.filter(r=>r.run.hr).map(r=>({x:X(r),y:r.run.hr}));
  const eff=runs.filter(r=>effOf(r.run)>0).map(r=>({x:X(r),y:effOf(r.run)}));
  html+='<div class="card"><h2>Pace (lower is faster)</h2>'+lineChart(pace,{color:'var(--run)',invert:true,fmt:v=>fmtPace(v).replace('/km','')})+'</div>';
  if(hr.length) html+='<div class="card"><h2>Average heart rate (bpm)</h2>'+lineChart(hr,{color:'var(--danger)',fmt:v=>String(Math.round(v))})+'</div>';
  if(eff.length>1&&(kf==='easy'||kf==='all'||kf==='long')) html+='<div class="card"><h2>Aerobic efficiency</h2>'+lineChart(eff,{color:'var(--ok)',fmt:v=>v.toFixed(2)})
    +'<div class="sub" style="text-align:center">Metres per minute, per heartbeat. Rising means the same effort is carrying you further \u2014 this is the number that shows your base building.</div></div>';
  const zc={in:0,above:0,below:0};
  runs.forEach(r=>{const v=zoneVerdict(runKind(r),r.run.hr);if(v)zc[v.t]++});
  if(zc.in+zc.above+zc.below) html+='<div class="card"><h2>Heart-rate discipline</h2><div class="stats"><div class="stat"><b>'+zc.in+'</b><span>in zone</span></div><div class="stat" style="color:var(--danger)"><b>'+zc.above+'</b><span>too hard</span></div><div class="stat"><b>'+zc.below+'</b><span>too easy</span></div></div>'
    +(zc.above>zc.in?'<div class="sub" style="margin-top:8px;color:var(--core);font-weight:600">Most of these runs were above their target band. Slowing down is what builds the base.</div>':'')+'</div>';
  html+=shoeProgress();
  return html;
}

function finishWorkout(){
  const sess={id:W.id,date:W.date,type:W.type,name:(W.name||TYPES[W.type]).trim(),templateId:W.templateId,startedAt:W.startedAt,durSec:Math.round((Date.now()-W.startedAt)/1000),notes:W.notes.trim(),createdAt:Date.now()};
  if(W.type==='run'){
    const km=num(W.run.km),secs=runSecs();
    if(km<=0||secs<=0){toast('Enter distance and time');return}
    sess.run={kind:W.run.kind||'easy',km:Math.round(km*100)/100,secs,hr:num(W.run.hr)||null,hrMax:num(W.run.hrMax)||null,shoeId:W.run.shoeId||null,
      reps:(W.run.reps||[]).map(r=>({secs:repSecs(r),hr:num(r.hr)||null})).filter(r=>r.secs>0)};
    sess.durSec=secs;
  } else {
    const items=W.items.map(it=>({exId:it.exId,name:it.name,measure:it.measure,sets:it.sets.filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r),t:num(s.t),pr:!!s.pr}))})).filter(it=>it.sets.length);
    if(!items.length){toast('Tick at least one set to finish');return}

  }
  if(W.date!==todayStr()&&W.type!=='run')sess.durSec=0;
  S.sessions.push(sess);saveSession(sess);

let hHalf=false;
const addDays=(ds,n)=>{const d=parseYmd(ds);d.setDate(d.getDate()+n);return ymd(d)};

function hS(){

  if(!Array.isArray(s.py))s.py=[{from:'2000-01-01',v:'build'}];

function hGet(key,ds){let v=null;(hS().set[key]||[]).forEach(x=>{if(x.from<=ds)v=x.v});return v}

function hToday(){const n=new Date();if(n.getHours()<H_GRACE){n.setDate(n.getDate()-1)}return ymd(n)}
function hDateOf(s){const t=s.startedAt||s.createdAt;if(t){const d=new Date(t);if(ymd(d)===s.date&&d.getHours()<H_GRACE)return addDays(s.date,-1)}return s.date}

  const missing=H_TASKS.filter(x=>!t[x[0]]).map(x=>x[0]);
  return {t:t,done:!missing.length,missing:missing,r:r,gym:gym,run:run,pyM:pyM,pyNeed:pyNeed,water:water,wt:wt,n:n};

function hRec(ds){const a=hS().active;a.days=a.days||{};return a.days[ds]=a.days[ds]||{}}
const H_SHORT={w1:'workout 1',w2:'the outdoor workout',diet:'the diet',water:'water',read:'reading',photo:'the progress photo',py:'Python/ML'};
const hTaskNames=ks=>{const l=ks.map(k=>H_SHORT[k]||k);return l.length>1?l.slice(0,-1).join(', ')+' and '+l[l.length-1]:l.join('')};
function hFind(id){const h=hS();if(id==='active'||(h.active&&h.active.id===id))return h.active;return h.attempts.find(x=>x.id===id)||null}
function hCheck(){
  const h=hS(),a=h.active;if(!a)return;
  const today=hToday();if(a.start>today)return;
  const last=addDays(a.start,74);let ch=false;
  for(let ds=a.start;ds<today&&ds<=last;ds=addDays(ds,1)){
    const r=(a.days||{})[ds];
    if(r&&r.ok)continue;
    const st=hStatus(a,ds);
    if(!st.done){hEnd(a,'missed',ds,st.missing);return}
    a.days=a.days||{};(a.days[ds]=a.days[ds]||{}).ok=true;ch=true;
  }

function hEnd(a,reason,ds,missing){
  const h=hS();

  else if(reason==='missed')dd=dayDiff(a.start,ds);
  else dd=a.start>ds?0:dayDiff(a.start,ds)+(hStatus(a,ds).done?1:0);
  a.reason=reason;a.brokeOn=ds<a.start?a.start:ds;a.missing=missing||[];a.daysDone=Math.max(0,dd);a.endedAt=Date.now();
  delete (a.days&&a.days[ds]||{}).pyT;

function hSummary(a,from,to){
  const h=hS(),ss=hSessRange(from,to),R=runStats(ss),G=gymStats(ss);

  const ez=R.runs.filter(x=>(runKind(x)==='easy'||runKind(x)==='recovery')&&x.run.hr);
  const sl=Object.keys(h.sleep).filter(k=>k>addDays(from,0)&&k<=addDays(to,1)).map(k=>num(h.sleep[k]));
  return {w1:w1,w2:w2,runN:R.n,km:r1(R.km),runSecs:R.secs,easyHr:ez.length?Math.round(ez.reduce((x,y)=>x+num(y.run.hr),0)/ez.length):0,
    gymN:G.n,vol:Math.round(G.vol),prs:G.prs.length,byName:byName,py:py,pyMax:pyMax,pages:pages,books:books,water:water,cre:cre,d3:d3,
    sleepAvg:sl.length?r1(sl.reduce((x,y)=>x+y,0)/sl.length):0,sleepShort:sl.filter(v=>v<6).length,sleepN:sl.length};

function hSleepChart(y,m){
  const sl=hS().sleep,days=new Date(y,m+1,0).getDate();
  const Wd=340,H=180,pl=26,pr=10,pt=10,pb=22;
  const X=d=>pl+(d-1)/(days-1)*(Wd-pl-pr),Y=v=>pt+(1-v/10)*(H-pt-pb);
  let g='<rect x="'+pl+'" y="'+Y(8).toFixed(1)+'" width="'+(Wd-pl-pr)+'" height="'+(Y(7)-Y(8)).toFixed(1)+'" fill="var(--ok)" opacity=".16"/>';
  [0,2,4,6,8,10].forEach(v=>{g+='<line class="grid" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(pl-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+v+'</text>'});
  [1,8,15,22,days].forEach(d=>{g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>'});
  const pts=[];for(let d=1;d<=days;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);if(sl[k]!=null)pts.push({d:d,v:num(sl[k]),k:k})}
  if(!pts.length)return '<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img">'+g+'<text x="'+(Wd/2)+'" y="'+(H/2)+'" text-anchor="middle">No sleep logged this month</text></svg>';
  const col=v=>v>=7?'var(--ok)':v>=6?'var(--core)':'var(--danger)';
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Sleep per night">'+g+(pts.length>1?'<path class="ln" stroke="var(--mute)" d="'+path+'"/>':'')
    +pts.map(p=>'<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" fill="'+col(p.v)+'"><title>'+esc(fmtDate(p.k,{day:'numeric',month:'short'})+': '+p.v+' h')+'</title></circle>').join('')+'</svg>';
}

function hAttemptsCard(){

  let l='';
  if(h.active){const a=h.active,started=a.start<=hToday();l+='<button class="item" data-act="h-att" data-a="active"><span class="grow"><b>Attempt '+a.n+'</b><div class="sub">'+(started?'In progress · Day '+(dayDiff(a.start,hToday())+1):'Starts '+esc(fmtDate(a.start,{day:'numeric',month:'short'})))+'</div></span></button>'}
  h.attempts.slice().reverse().forEach(a=>{l+='<button class="item" data-act="h-att" data-a="'+a.id+'"><span class="grow"><b>Attempt '+a.n+'</b>'+(best>0&&a.daysDone===best?' <span class="badge on">Best</span>':'')+'<div class="sub">'+a.daysDone+' days · '+esc(hReason(a))+'</div></span><span class="sub">'+esc(fmtDate(a.start,{day:'numeric',month:'short'}))+'</span></button>'});
  return '<div class="card"><h2>Attempts</h2><div class="list">'+l+'</div></div>';

function hEnsureTemplates(){
  const ex=S.cfg.exercises=S.cfg.exercises||[];
  const find=nm=>ex.find(e=>String(e.name||'').trim().toLowerCase()===nm.toLowerCase());
  H_EXTRA.forEach(c=>{if(!find(c[0]))ex.push({id:uid(),name:c[0],type:c[1],group:c[2],measure:c[3],level:c[4],run:!!c[5],notes:'',video:''})});
  S.cfg.templates=S.cfg.templates||[];let n=0;
  H_TPLS.forEach(t=>{
    if(tplById(t.id))return;
    const items=t.items.map(x=>{const e=find(x[0]);return e?{exId:e.id,sets:x[1],reps:x[2]}:null}).filter(Boolean);
    S.cfg.templates.push({id:t.id,name:t.name,type:t.type,runKind:'easy',targetKm:'',focus:[],items:items});n++;
  });
  return n;
}

function hField(e){

  const r=hRec(hToday());
  if(k==='pages'){r.pages=t.value;saveCfg();if(e.type==='change')render()}
  else if(k==='book'){r.book=t.value;saveCfg()}

    case 'pick-all':{e.preventDefault();S.pickAll=!S.pickAll;const el=$('#picklist');if(el)el.innerHTML=pickListHTML();break}
    case 'wk-pick':{const ex=exById(d.id);if(ex){W.items.push(newItem(ex,3,''));saveDraft()}closeModal();renderWorkout();break}
    case 'rest-add':if(R){R.end+=num(d.v)*1000;R.total=Math.max(R.total,Math.ceil((R.end-Date.now())/1000));R.fired=false;R.hideAt=0;paintRest()}break;
    case 'rest-skip':R=null;paintRest();break;
  }
});
function onField(e){
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='set'){W.items[+t.dataset.i].sets[+t.dataset.j][t.dataset.k]=t.value;saveDraft()}
  else if(f==='rep'){W.run.reps[+t.dataset.i][t.dataset.k]=t.value;saveDraft()}
  else if(f==='run'){
    W.run[t.dataset.k]=t.value;
    const pb=$('#pacebox');if(pb)pb.textContent=paceText();
    if(t.dataset.k==='hr'){const zb=$('#zonebox');if(zb)zb.innerHTML=zoneBarHTML(W.run.kind||'easy',t.value)}
    saveDraft();
  }
  else if(f==='wk-name'){W.name=t.value;saveDraft()}
  else if(f==='wk-notes'){W.notes=t.value;saveDraft()}
  else if(f==='wk-date'){if(t.value){W.date=t.value;saveDraft()}}
  else if(f==='pick'){S.pickQ=t.value;const el=$('#picklist');if(el)el.innerHTML=pickListHTML()}
  else if(f==='libq'){S.libQ=t.value;const el=$('#libresults');if(el)el.innerHTML=libResultsHTML()}
  else if(f==='te-name'){
    if(!TE)return;
    TE.name=t.value;
    if(!TE.focusManual){
      clearTimeout(TE._t);
      TE._t=setTimeout(()=>{
        TE.focus=inferFocus(TE.name);
        const el=$('#tefocus');if(el)el.innerHTML=teFocusHTML();
      },350);
    }
  }
  else if(e.type==='change'){
    if(f==='plan-add'){const v=t.value;if(v){const i=+t.dataset.d,a=planFor(i);if(a.indexOf(v)<0){a.push(v);setPlan(i,a)}}t.value='';render()}
    else if(f==='maxhr'){S.cfg.maxHR=t.value;saveCfg()}
    else if(f==='resthr'){S.cfg.restHR=t.value;saveCfg()}
    else if(f==='prog-ex'){S.prog.ex=t.value;render()}
    else if(f==='rest'){S.cfg.rest=+t.value;saveCfg()}
    else if(f==='te-type'){syncTE();renderTE()}
  }
}
document.addEventListener('pointerdown',function(e){
  const m=e.target.closest&&e.target.closest('[data-act="musclepick"]');
  const lab=$('#mulabel');
  if(!m||!lab)return;
  const g=muscleGroup(m.dataset.s);
  if(g)lab.innerHTML='<b>'+esc(g.name)+'</b> \u00b7 '+g.n+' exercises';
});
document.addEventListener('input',onField);
document.addEventListener('change',onField);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- boot ---------- */
function loadDraft(){/* draft is read on demand from localStorage */}
function startLocal(note){
  P.mode='local';P.note=note||'';
  S.cfg=Object.assign(DEF(),lsGet('wl_cfg')||(lsGet('wl_mirror')||{}).cfg||{});
  S.sessions=lsGet('wl_sessions')||(lsGet('wl_mirror')||{}).sessions||[];
  afterLoad();S.ready=true;render();
}
function startCloud(db,id){
  P.mode='cloud';
  P.cfgRef=db.doc('data/users/'+id+'/cfg');
  P.sessCol=P.cfgRef.collection('sessions');
  let gc=false,gs=false;
  const check=()=>{
    if(gc&&gs&&!S.ready){afterLoad();S.ready=true;render();return}
    if(S.ready&&!W)render();
  };
  const fail=err=>{
    if(!S.ready){
      const n=$('#loadnote');
      if(n)n.innerHTML='Couldn’t reach storage ('+esc((err&&err.code)||'error')+').<br><button class="btn" style="margin-top:10px" data-act="local-mode">Use this device only</button>';
    } else toast('Sync problem: '+((err&&err.code)||'error'));
  };
  P.cfgRef.onSnapshot(snap=>{
    if(S.ready&&(P.pending>0||snap.metadata.hasPendingWrites))return;
    if(snap.exists)S.cfg=Object.assign(DEF(),clone(snap.data()));
    gc=true;check();
  },fail);
  P.sessCol.onSnapshot(snap=>{
    S.sessions=snap.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));
    gs=true;check();
  },fail);
  setTimeout(()=>{
    if(!S.ready){const n=$('#loadnote');if(n)n.innerHTML='Taking a while…<br><button class="btn" style="margin-top:10px" data-act="local-mode">Use this device only</button>'}
  },10000);
}
document.addEventListener('click',e=>{if(e.target.closest('[data-act="local-mode"]'))startLocal('Storage unavailable — data is kept on this device only.')});
function boot(){
  try{document.body.insertAdjacentHTML('afterbegin',BODY_DEFS)}catch(e){}
  render();
  startLocal('');
}
boot();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
